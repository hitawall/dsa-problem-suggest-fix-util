name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json is valid JSON
        run: python3 -c "import json, sys; json.load(open('manifest.json'))" && echo "manifest.json — valid JSON"

      - name: Validate manifest_version is 3
        run: |
          MV=$(python3 -c "import json; print(json.load(open('manifest.json'))['manifest_version'])")
          [ "$MV" = "3" ] || { echo "manifest_version must be 3, got $MV"; exit 1; }
          echo "manifest_version: $MV — OK"

      - name: Check all files referenced in manifest exist
        run: |
          python3 - <<'EOF'
          import json, os, sys
          m = json.load(open("manifest.json"))
          refs = []
          refs.append(m.get("background", {}).get("service_worker", ""))
          refs.append(m.get("action", {}).get("default_popup", ""))
          for cs in m.get("content_scripts", []):
              refs.extend(cs.get("js", []))
              refs.extend(cs.get("css", []))
          missing = [r for r in refs if r and not os.path.exists(r)]
          if missing:
              print("Missing files:", missing); sys.exit(1)
          print("All manifest-referenced files exist — OK")
          EOF

      - name: Check no inline scripts in popup.html (MV3 CSP)
        run: |
          if grep -qn '<script>' src/popup.html; then
            echo "Inline <script> tag found in popup.html — MV3 CSP violation"; exit 1
          fi
          echo "No inline scripts in popup.html — OK"

      - name: Check no external CDN references in src/
        run: |
          if grep -rn 'cdn\.' src/ --include='*.html' --include='*.js' 2>/dev/null; then
            echo "CDN reference found — all dependencies must be vendored locally"; exit 1
          fi
          echo "No CDN references in src/ — OK"

      - name: Check vendored libs are present
        run: |
          test -f src/lib/marked.min.js || {
            echo "src/lib/marked.min.js missing. Run:"
            echo "  curl -fsSL https://cdn.jsdelivr.net/npm/marked@12/marked.min.js -o src/lib/marked.min.js"
            exit 1
          }
          test -f src/lib/diff.min.js || {
            echo "src/lib/diff.min.js missing. Run:"
            echo "  curl -fsSL https://cdn.jsdelivr.net/npm/diff@7/dist/diff.min.js -o src/lib/diff.min.js"
            exit 1
          }
          echo "Vendored libs present — OK"

      - name: Check API key is not hardcoded
        run: |
          if grep -rn 'sk-ant-' src/ --include='*.js' 2>/dev/null; then
            echo "Hardcoded API key found in src/ — remove it immediately"; exit 1
          fi
          echo "No hardcoded API keys found — OK"
