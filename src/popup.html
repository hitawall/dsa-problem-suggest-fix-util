<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NeetCode Debug Overlay</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 280px;
      padding: 16px;
      background: #1e1e1e;
      color: #e0e0e0;
      margin: 0;
    }
    h2 {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 600;
    }
    p {
      margin: 0 0 12px;
      font-size: 12px;
      color: #888;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #e0e0e0;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 8px;
      outline: none;
    }
    input:focus { border-color: #0ea5e9; }
    button {
      width: 100%;
      padding: 8px;
      background: #0ea5e9;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    button:hover { background: #0284c7; }
    #status {
      margin-top: 8px;
      font-size: 12px;
      min-height: 16px;
      color: #4ade80;
    }
  </style>
</head>
<body>
  <h2>NeetCode Debug Overlay</h2>
  <p>Paste your Anthropic API key below.</p>
  <input id="apiKey" type="password" placeholder="sk-ant-...">
  <button id="saveBtn">Save Key</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
