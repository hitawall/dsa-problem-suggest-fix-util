<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NeetCode Debug Overlay</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 300px;
      padding: 16px;
      background: #1e1e1e;
      color: #e0e0e0;
      margin: 0;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 14px;
      font-weight: 600;
    }
    label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    select, input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #e0e0e0;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
    }
    select { cursor: pointer; }
    select:focus, input:focus { border-color: #0ea5e9; }
    button {
      width: 100%;
      padding: 8px;
      background: #0ea5e9;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    button:hover { background: #0284c7; }
    #status {
      margin-top: 8px;
      font-size: 12px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h2>NeetCode Debug Overlay</h2>

  <label for="provider">Provider</label>
  <select id="provider">
    <option value="gemini">Gemini (Google AI Studio)</option>
    <option value="groq">Groq</option>
    <option value="anthropic">Anthropic (Claude)</option>
    <option value="openai">OpenAI</option>
  </select>

  <label for="apiKey">API Key</label>
  <input id="apiKey" type="password" placeholder="AIza...">

  <button id="saveBtn">Save Key</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
