<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NeetCode Debug Overlay</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 240px;
      padding: 14px 16px;
      background: #1e1e1e;
      color: #e0e0e0;
      margin: 0;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: #f0f0f0;
    }
    label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #e0e0e0;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
      margin-bottom: 10px;
    }
    select:focus { border-color: #0ea5e9; }
    #keyStatus {
      font-size: 12px;
      min-height: 14px;
      margin-bottom: 12px;
    }
    #manageBtn {
      width: 100%;
      padding: 8px;
      background: #2a2a2a;
      color: #aaa;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
    }
    #manageBtn:hover { background: #333; color: #e0e0e0; border-color: #555; }
  </style>
</head>
<body>
  <h2>NeetCode Debug Overlay</h2>

  <label for="provider">Active Provider</label>
  <select id="provider">
    <option value="gemini">Gemini (Google AI Studio)</option>
    <option value="groq">Groq</option>
    <option value="anthropic">Anthropic (Claude)</option>
    <option value="openai">OpenAI</option>
  </select>

  <div id="keyStatus"></div>

  <button id="manageBtn">⚙ Manage API Keys</button>

  <script src="popup.js"></script>
</body>
</html>
